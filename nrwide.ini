; nrwide settings. Edit, save, restart the game through nrwide_launcher.exe.
[nrwide]
; 1 = remove the 16:9 black bars (use your 21:9 / 32:9 resolution in the game's graphics options)
ultrawide=1
; 1 = raise the 60 FPS cap
fps_unlock=1
; frame cap. 0 = your monitor's current refresh rate. Range 30-1000.
fps_limit=0
; 1 = stop fullscreen mode forcing the monitor to 60 Hz
remove_60hz_lock=1
; 1 = FOV adjust. In game: F7 = wider, F8 = narrower. The value is saved here and restored next launch.
fov=1
; degrees added to the game's own FOV (F7/F8 change this)
fov_offset=0
fov_step=5
fov_min=-30
fov_max=60
; virtual-key codes: 118 = F7, 119 = F8
fov_up_key=118
fov_down_key=119

[launcher]
; folder that holds nightreign.exe
game_dir=C:\Program Files (x86)\Steam\steamapps\common\ELDEN RING NIGHTREIGN\Game
; direct   = solo offline (game started by this launcher)
; seamless = co-op with friends through Seamless Co-op (its launcher starts the game, nrwide joins it)
mode=direct
; Seamless Co-op launcher (in game_dir) and the DLL it loads; only change if the mod renames them
seamless_launcher=nrsc_launcher.exe
seamless_module=nrsc.dll
